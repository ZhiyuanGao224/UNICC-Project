name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend — lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff, advisory)
        continue-on-error: true
        run: |
          pip install ruff --quiet
          ruff check council/ frontend_api/ Expert1/ "Expert 2/" "Expert 3/" \
            --ignore E501,E402,F401

      - name: Compile check (all Python modules import-parse)
        run: python -m compileall -q council frontend_api Expert1 "Expert 2" "Expert 3"

      # Expert 1 unit tests. Six tests in test_unit_combined.py and the
      # test_data_validator.py import are known to fail against the current
      # inspect-ai API; they are reported here (non-blocking) instead of being
      # silently skipped, until they are fixed.
      - name: Expert 1 unit tests (no API key; known failures, non-blocking)
        continue-on-error: true
        env:
          MOCK_MODE: "1"
          ANTHROPIC_API_KEY: "sk-ant-mock-key-for-ci"
        run: |
          pip install pytest pytest-asyncio inspect-ai --quiet
          python -m pytest Expert1/tests/test_unit_combined.py \
                           Expert1/tests/test_data_validator.py \
                           Expert1/tests/test_utils.py \
            -v --tb=short

  frontend-build:
    name: Frontend — install + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: real_frontend/package-lock.json

      - name: Install dependencies
        working-directory: real_frontend
        run: npm ci

      - name: Type-check
        working-directory: real_frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        working-directory: real_frontend
        run: npm run build
        env:
          VITE_COUNCIL_BACKEND: claude
